<section class="descargar-page">
  <header class="descargar-header">
    <h2 class="descargar-title">Descargar Comparendo</h2>
    <p class="descargar-description">
      Descargue el comparendo de la Ley 1801 o actualice toda la información de los comparendos de un
      ciudadano.
    </p>
  </header>

  <div class="descargar-form">
    <app-select label="Tipo de documento" [options]="['CC', 'TI', 'NIT']"></app-select>
    <app-input-text
      label="Número de documento"
      placeholder="Ingrese el número de comparendo"
    ></app-input-text>

    <div class="descargar-actions">
      <app-button label="Descargar" (clicked)="descargar()"></app-button>
    </div>
  </div>
</section>
