<div class="form-group">
  <label [for]="id" [class.campo-etiqueta--oculta]="ocultarEtiqueta">{{ label }}</label>
  <select class="form-control" [id]="id" [disabled]="readOnly" (change)="onChange($event)" (blur)="onBlur()">
    @if (!value) {
      <option value="" disabled selected></option>
    }
    @for (option of options; track option) {
      <option [value]="option" [selected]="option === value">{{ option }}</option>
    }
  </select>
</div>
