<div class="form-group">
  <label [for]="id" [class.campo-etiqueta--oculta]="ocultarEtiqueta">{{ label }}</label>
  <input
    class="form-control"
    [type]="type"
    [attr.step]="type === 'number' ? step : null"
    [id]="id"
    [placeholder]="placeholder"
    [value]="value"
    [readOnly]="readOnly"
    (change)="onChange($event)"
    (blur)="onBlur($event)"
  />
</div>
